  <path d="M 256 220 L 256 288" stroke="url(#goldRim)" stroke-width="5" stroke-linecap="round" />
  <path d="M 256 245 Q 236 230 220 235" fill="none" stroke="url(#goldRim)" stroke-width="4" stroke-linecap="round" />
  <path d="M 256 245 Q 276 230 292 235" fill="none" stroke="url(#goldRim)" stroke-width="4" stroke-linecap="round" />
  <path d="M 256 265 Q 240 252 228 258" fill="none" stroke="url(#goldRim)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 256 265 Q 272 252 284 258" fill="none" stroke="url(#goldRim)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Ruby Suit Jewels -->
  <polygon points="105,256 122,236 105,216 88,236" fill="url(#rubyGlow)" stroke="url(#goldRim)" stroke-width="1.5" />
  <path d="M 407 250 C 398 242, 393 234, 393 227 C 393 221, 399 217, 404 219 C 407 220, 407 222, 407 224 C 407 222, 407 220, 410 219 C 415 217, 421 221, 421 227 C 421 234, 416 242, 407 250 Z" fill="url(#rubyGlow)" stroke="url(#goldRim)" stroke-width="1.2" transform="scale(1.3) translate(-85,-40)" />

  <!-- Base Inscription Banner -->
  <path d="M 140 405 Q 256 422 372 405 L 380 435 Q 256 455 132 435 Z" fill="url(#goldRim)" />
  <path d="M 146 408 Q 256 424 366 408 L 372 432 Q 256 450 140 432 Z" fill="#04120b" />
  <text x="256" y="426" text-anchor="middle" font-family="'Tajawal', sans-serif" font-weight="900" font-size="19" fill="url(#goldRim)">
    بلوت
