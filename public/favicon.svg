  <!-- Inner Obsidian Spade Core -->
  <path d="M 256 195 C 245 224, 180 265, 180 298 C 180 320, 200 334, 222 332 C 234 331, 246 322, 256 310 C 266 322, 278 331, 290 332 C 312 334, 332 320, 332 298 C 332 265, 267 224, 256 195 Z"
        fill="#071810" />

