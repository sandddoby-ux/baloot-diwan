      <stop offset="70%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="256" cy="256" r="248" fill="url(#goldRim)" />
  <circle cx="256" cy="256" r="232" fill="#040e09" />
  <circle cx="256" cy="256" r="226" fill="url(#goldRim)" />
  <circle cx="256" cy="256" r="218" fill="url(#emeraldFelt)" />

  <!-- Crown Top -->
  <path d="M 200 135 L 220 162 L 256 122 L 292 162 L 312 135 L 302 180 L 210 180 Z" fill="url(#goldRim)" />
  <circle cx="256" cy="116" r="10" fill="url(#rubyGlow)" stroke="url(#goldRim)" stroke-width="2" />
  <circle cx="200" cy="130" r="7" fill="url(#rubyGlow)" />
  <circle cx="312" cy="130" r="7" fill="url(#rubyGlow)" />

