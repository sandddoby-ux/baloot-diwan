  <path d="M 230 370 Q 256 364 282 370 L 286 378 Q 256 372 226 378 Z" fill="url(#goldRim)" />
  <path d="M 256 170 C 242 205, 160 255, 160 300 C 160 330, 185 350, 218 348 C 235 347, 245 336, 256 324 C 267 336, 277 347, 294 348 C 327 350, 352 330, 352 300 C 352 255, 270 205, 256 170 Z"
