<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="emeraldFelt" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#144d34" />
      <stop offset="60%" stop-color="#0a2a1c" />
      <stop offset="100%" stop-color="#03100a" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#fff4cc" />
      <stop offset="100%" stop-color="#996c08" />
