<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient (Deep Emerald Felt) -->
    <radialGradient id="emeraldFelt" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#144d34" />
      <stop offset="50%" stop-color="#0a2a1c" />
      <stop offset="85%" stop-color="#05170f" />
      <stop offset="100%" stop-color="#020906" />
    </radialGradient>

    <!-- 24K Gold Metallic Linear Gradients -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="25%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#fff4cc" />
      <stop offset="75%" stop-color="#aa7c11" />
      <stop offset="100%" stop-color="#fdf1c2" />
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="35%" stop-color="#e6b94d" />
      <stop offset="70%" stop-color="#c48e1b" />
      <stop offset="100%" stop-color="#8a5c05" />
    </linearGradient>

    <linearGradient id="rubyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <linearGradient id="onyxShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Filters: Drop Shadow & Ambient Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="embossShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Outer Shadow Circle -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#000000" stroke-width="8" opacity="0.4" filter="url(#softShadow)" />

  <!-- Outer Luxury Gold Beaded Ring -->
  <circle cx="256" cy="256" r="240" fill="url(#goldRim)" />
  <circle cx="256" cy="256" r="230" fill="#040e09" />

  <!-- Outer Intricate Filigree Ring -->
  <circle cx="256" cy="256" r="226" fill="url(#goldBright)" />
  <circle cx="256" cy="256" r="221" fill="url(#emeraldFelt)" />

  <!-- Decorative Islamic Geometric 16-point Star Ray Petals (Faint Gold Background) -->
  <g opacity="0.18" stroke="url(#goldRim)" stroke-width="1.5" fill="none">
    <circle cx="256" cy="256" r="210" stroke-dasharray="4,8" />
    <circle cx="256" cy="256" r="195" />
    <circle cx="256" cy="256" r="180" stroke-dasharray="2,6" />
    <polygon points="256,46 296,160 416,160 320,230 356,346 256,280 156,346 192,230 96,160 216,160" />
    <polygon points="256,466 216,352 96,352 192,282 156,166 256,232 356,166 320,282 416,352 296,352" />
  </g>

  <!-- Inner Gold Inset Frame -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#c5a059" stroke-width="1" stroke-dasharray="3,4" opacity="0.6" />

  <!-- ================= CENTER EMBLEM ================= -->

  <!-- Crossed Saudi Royal Golden Palms / Scimitars at Base -->
  <g id="base-wreath" filter="url(#embossShadow)">
    <!-- Left Palm Branch -->
    <path d="M 170 360 C 185 390, 220 405, 256 405" fill="none" stroke="url(#goldBright)" stroke-width="4" stroke-linecap="round" />
    <path d="M 180 365 Q 165 355 155 350" fill="none" stroke="url(#goldRim)" stroke-width="3" stroke-linecap="round" />
    <path d="M 195 375 Q 180 375 168 375" fill="none" stroke="url(#goldRim)" stroke-width="3" stroke-linecap="round" />
    <path d="M 215 387 Q 200 395 190 400" fill="none" stroke="url(#goldRim)" stroke-width="3" stroke-linecap="round" />
    <path d="M 235 398 Q 225 412 215 418" fill="none" stroke="url(#goldRim)" stroke-width="3" stroke-linecap="round" />

    <!-- Right Palm Branch -->
    <path d="M 342 360 C 327 390, 292 405, 256 405" fill="none" stroke="url(#goldBright)" stroke-width="4" stroke-linecap="round" />
    <path d="M 332 365 Q 347 355 357 350" fill="none" stroke="url(#goldRim)" stroke-width="3" stroke-linecap="round" />
    <path d="M 317 375 Q 332 375 344 375" fill="none" stroke="url(#goldRim)" stroke-width="3" stroke-linecap="round" />
    <path d="M 297 387 Q 312 395 322 400" fill="none" stroke="url(#goldRim)" stroke-width="3" stroke-linecap="round" />
    <path d="M 277 398 Q 287 412 297 418" fill="none" stroke="url(#goldRim)" stroke-width="3" stroke-linecap="round" />

    <!-- Center Palm Trunk Emblem -->
    <path d="M 256 408 L 256 368" stroke="url(#goldBright)" stroke-width="5" stroke-linecap="round" />
    <polygon points="256,360 250,372 262,372" fill="url(#goldRim)" />
  </g>

  <!-- Crown / Diwan Coronet atop Ace of Spades -->
  <g id="royal-crown" filter="url(#goldGlow)">
    <path d="M 216 142 L 230 162 L 256 130 L 282 162 L 296 142 L 290 178 L 222 178 Z" fill="url(#goldBright)" stroke="url(#goldRim)" stroke-width="1.5" />
    <!-- Crown Jewels -->
    <circle cx="216" cy="138" r="4.5" fill="url(#rubyGlow)" stroke="url(#goldRim)" stroke-width="1" />
    <circle cx="256" cy="125" r="6" fill="url(#rubyGlow)" stroke="url(#goldRim)" stroke-width="1.5" />
    <circle cx="296" cy="138" r="4.5" fill="url(#rubyGlow)" stroke="url(#goldRim)" stroke-width="1" />
    <circle cx="256" cy="168" r="3.5" fill="#144d34" stroke="url(#goldRim)" stroke-width="1" />
    <circle cx="238" cy="170" r="3" fill="url(#rubyGlow)" />
    <circle cx="274" cy="170" r="3" fill="url(#rubyGlow)" />
  </g>

  <!-- Center Golden Ace of Spades (الكة الملكية - رمز البلوت) -->
  <g id="ace-spade-center" filter="url(#embossShadow)">
    <!-- Base Pedestal of the Spade -->
    <path d="M 256 295 L 244 336 L 268 336 Z" fill="url(#goldBright)" stroke="url(#goldRim)" stroke-width="2" />
    <path d="M 238 336 Q 256 332 274 336 L 278 342 Q 256 338 234 342 Z" fill="url(#goldRim)" />

    <!-- The Spade Body (Sculpted Gold with Deep Obsidian Inlay) -->
    <path d="M 256 168 C 246 195, 185 240, 185 278 C 185 304, 206 320, 232 318 C 245 317, 252 308, 256 298 C 260 308, 267 317, 280 318 C 306 320, 327 304, 327 278 C 327 240, 266 195, 256 168 Z"
          fill="url(#goldBright)"
          stroke="url(#goldRim)"
          stroke-width="4" />

    <!-- Inner Spade Obsidian/Onyx Gem Core -->
    <path d="M 256 182 C 248 205, 198 244, 198 276 C 198 296, 214 308, 233 306 C 244 305, 250 297, 256 288 C 262 297, 268 305, 279 306 C 298 308, 314 296, 314 276 C 314 244, 264 205, 256 182 Z"
          fill="url(#onyxShine)"
          stroke="url(#goldRim)"
          stroke-width="2" />

    <!-- Golden Palm & Sword engraving inside Spade core -->
    <path d="M 256 205 L 256 270" stroke="url(#goldBright)" stroke-width="3" stroke-linecap="round" />
    <!-- Crossed Blades -->
    <path d="M 242 260 Q 256 252 270 248" fill="none" stroke="url(#goldRim)" stroke-width="2" stroke-linecap="round" />
    <path d="M 270 260 Q 256 252 242 248" fill="none" stroke="url(#goldRim)" stroke-width="2" stroke-linecap="round" />
    <circle cx="256" cy="235" r="4.5" fill="url(#goldRim)" />
  </g>

  <!-- ================= 4 CARD SUITS MEDALLIONS ================= -->

  <!-- Top-Left: Sbit / Spades ♠️ -->
  <g transform="translate(108, 172)" filter="url(#embossShadow)">
    <circle cx="0" cy="0" r="22" fill="#0c2317" stroke="url(#goldRim)" stroke-width="2" />
    <!-- Spade Icon -->
    <path d="M 0 -10 C -2 -5, -10 2, -10 7 C -10 11, -6 14, -2 13.5 C 0 12, -0.5 10, 0 8 C 0.5 10, 0 12, 2 13.5 C 6 14, 10 11, 10 7 C 10 2, 2 -5, 0 -10 Z" fill="url(#goldBright)" />
    <path d="M 0 8 L -3 13 L 3 13 Z" fill="url(#goldBright)" />
  </g>

  <!-- Top-Right: Haim / Hearts ♥️ -->
  <g transform="translate(404, 172)" filter="url(#embossShadow)">
    <circle cx="0" cy="0" r="22" fill="#0c2317" stroke="url(#goldRim)" stroke-width="2" />
    <!-- Heart Icon in Ruby -->
    <path d="M 0 12 C -8 5, -12 -2, -12 -7 C -12 -12, -7 -14, -3 -12 C -1 -11, 0 -9, 0 -7 C 0 -9, 1 -11, 3 -12 C 7 -14, 12 -12, 12 -7 C 12 -2, 8 5, 0 12 Z" fill="url(#rubyGlow)" stroke="url(#goldRim)" stroke-width="0.8" />
  </g>

  <!-- Bottom-Left: Daiman / Diamonds ♦️ -->
  <g transform="translate(108, 320)" filter="url(#embossShadow)">
    <circle cx="0" cy="0" r="22" fill="#0c2317" stroke="url(#goldRim)" stroke-width="2" />
    <!-- Diamond in Faceted Ruby -->
    <polygon points="0,-13 11,0 0,13 -11,0" fill="url(#rubyGlow)" stroke="url(#goldRim)" stroke-width="1.2" />
    <polygon points="0,-8 7,0 0,8 -7,0" fill="#ff7676" opacity="0.6" />
  </g>

  <!-- Bottom-Right: Sheria / Clubs ♣️ -->
  <g transform="translate(404, 320)" filter="url(#embossShadow)">
    <circle cx="0" cy="0" r="22" fill="#0c2317" stroke="url(#goldRim)" stroke-width="2" />
    <!-- Clubs Icon in Gold -->
    <circle cx="0" cy="-6" r="5.5" fill="url(#goldBright)" />
    <circle cx="-6.5" cy="2" r="5.5" fill="url(#goldBright)" />
    <circle cx="6.5" cy="2" r="5.5" fill="url(#goldBright)" />
    <path d="M 0 0 L -3 11 L 3 11 Z" fill="url(#goldBright)" />
  </g>

  <!-- ================= ARABIC BRAND BANNER RIBBON ================= -->
  <g id="brand-ribbon" filter="url(#softShadow)" transform="translate(0, 15)">
    <!-- Gold Ribbon Background Curve -->
    <path d="M 120 420 Q 256 438 392 420 L 406 448 Q 256 468 106 448 Z" fill="url(#goldRim)" stroke="#744f07" stroke-width="1.5" />
    <path d="M 125 423 Q 256 441 387 423 L 398 445 Q 256 463 114 445 Z" fill="#06180f" />

    <!-- Ribbon Fishtail Ends -->
    <polygon points="106,448 120,420 90,432" fill="url(#goldBright)" />
    <polygon points="406,448 392,420 422,432" fill="url(#goldBright)" />

    <!-- Arabic Calligraphy Text: ديوان البلوت -->
    <text x="256" y="440"
          text-anchor="middle"
          font-family="'Tajawal', 'Amiri', 'Traditional Arabic', serif"
          font-weight="900"
          font-size="20"
          letter-spacing="1.5"
          fill="url(#goldBright)"
          filter="url(#embossShadow)">
      ديوان البلوت
    </text>

    <!-- Subtitle: BALOOT DIWAN -->
    <text x="256" y="456"
          text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-weight="800"
          font-size="8.5"
          letter-spacing="3.5"
          fill="#e2e8f0"
          opacity="0.95">
      BALOOT DIWAN
    </text>
  </g>

  <!-- Top Banner Stars -->
  <g fill="url(#goldBright)" opacity="0.9">
    <polygon points="256,70 258,76 264,76 259,80 261,86 256,82 251,86 253,80 248,76 254,76" />
    <polygon points="226,76 227,81 232,81 228,84 230,89 226,86 222,89 224,84 220,81 225,81" />
    <polygon points="286,76 287,81 292,81 288,84 290,89 286,86 282,89 284,84 280,81 285,81" />
  </g>
</svg>
